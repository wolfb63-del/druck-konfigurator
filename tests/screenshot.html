<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:100vw;height:100vh;display:block}body{overflow:hidden}</style>
<!-- Hilfsseite für Sichtprüfungen: ?printer=snapmaker_u1&model=1|2&tab=3d&menu=2&export=3 – headless-Screenshot über http://127.0.0.1 laden. -->
<script>try{localStorage.setItem("druckKonfigurator.disclaimer",new URLSearchParams(location.search).get("disclaimer")?"0":"1")}catch(e){}
try{if(new URLSearchParams(location.search).get('orca')){localStorage.setItem('kobraS1Konfigurator.v4',JSON.stringify({last:{printer:'orca',orcaPrinter:{vendor:'Creality',name:'Creality Ender-3 V3 SE 0.4 nozzle'}},profiles:{},settings:{}}))}}catch(e){}</script>
<script>
// ls=<name>: gespeicherten Zustand aus tests/_ls_<name>.json vor dem Laden setzen (synchron, damit er vor dem iframe greift)
try{const n=new URLSearchParams(location.search).get('ls');if(n){const x=new XMLHttpRequest();x.open('GET','_ls_'+n+'.json',false);x.send();localStorage.setItem('kobraS1Konfigurator.v4',x.responseText)}}catch(e){}
</script>
<div id="errbox" style="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#300;color:#fbb;font:13px monospace;padding:4px;white-space:pre-wrap;display:none"></div>
<iframe id="f" src="../index.html"></iframe>
<script>
const q=new URLSearchParams(location.search);
f.onload=()=>{const w=f.contentWindow,d=w.document;
 // Fehler im Tool sichtbar machen (unten rot eingeblendet)
 const eb=document.getElementById('errbox');w.addEventListener('error',e=>{eb.style.display='block';eb.textContent+='FEHLER: '+e.message+' @ '+(e.filename||'').split('/').pop()+':'+e.lineno+'\n'});
 if(q.get('clickorca'))setTimeout(()=>{try{d.getElementById('printerOrcaBtn').click()}catch(e){eb.style.display='block';eb.textContent+='FEHLER: '+e.message+'\n'+e.stack.split('\n').slice(0,4).join('\n')}},500);
 function box(x0,y0,z0,x1,y1,z1){const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];return [[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]].map(t=>t.map(i=>v[i]))}
 const tris=[...box(15,15,0,25,25,20),...box(0,0,20,40,40,25)],buf=new ArrayBuffer(84+tris.length*50),dv=new DataView(buf);dv.setUint32(80,tris.length,true);tris.forEach((t,i)=>t.flat().forEach((c,j)=>dv.setFloat32(84+i*50+12+j*4,c,true)));
 // hole=1: 40×40×6-Platte mit rundem Loch Ø5 mittig (für den Passgenauigkeits-Hinweis)
 function plateHole(size,h,r,cx,cy,n){const half=size/2,tr=[];const sq=a=>{const c=Math.cos(a),s=Math.sin(a),k=half/Math.max(Math.abs(c),Math.abs(s));return[cx+k*c,cy+k*s]};const ci=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  for(let i=0;i<n;i++){const a=2*Math.PI*i/n,b=2*Math.PI*(i+1)/n,[oa,ob,ia,ib]=[sq(a),sq(b),ci(a),ci(b)];
   tr.push([[...ia,h],[...oa,h],[...ob,h]],[[...ia,h],[...ob,h],[...ib,h]],[[...ia,0],[...ob,0],[...oa,0]],[[...ia,0],[...ib,0],[...ob,0]]);
   tr.push([[...oa,0],[...ob,0],[...ob,h]],[[...oa,0],[...ob,h],[...oa,h]],[[...ia,0],[...ib,h],[...ib,0]],[[...ia,0],[...ia,h],[...ib,h]]);}
  return tr}
 const htris=plateHole(40,6,2.5,20,20,32),hbuf=new ArrayBuffer(84+htris.length*50),hdv=new DataView(hbuf);hdv.setUint32(80,htris.length,true);htris.forEach((t,i)=>t.flat().forEach((c,j)=>hdv.setFloat32(84+i*50+12+j*4,c,true)));
 if(q.get('printer'))d.querySelector('.printer-switch [data-printer="'+q.get('printer')+'"]').click();
 // model=N: N Pilze als Teile (Teileliste); hole=1: Platte mit Ø5-Loch statt Pilz
 // file=<Name>: Datei aus tests/ laden (z. B. eine echte 3MF, vorübergehend hineinkopiert)
 const loaded=q.get('file')?fetch(q.get('file')).then(r=>r.arrayBuffer()).then(b=>w.loadFiles([new w.File([b],q.get('file'))])):q.get('hole')?w.loadFiles([new w.File([hbuf],'platte-loch.stl')]):q.get('model')?w.loadFiles(Array.from({length:Math.max(1,+q.get('model')||1)},(_,i)=>new w.File([buf],i?'pilz-'+(i+1)+'.stl':'pilz.stl'))):Promise.resolve();
 loaded.then(()=>{
  if(q.get('scroll'))w.document.querySelector('.inputs').scrollIntoView();if(q.get('card'))d.getElementById('modelCard').scrollIntoView();
  if(q.get('tab')==='3d')d.getElementById('tab3d').click();
  // partstep=N: N-mal „Nächstes Teil“ in der 3D-Ansicht
  for(let i=0;i<+(q.get('partstep')||0);i++)d.querySelector('#partSwitch3d [data-part-step="1"]').click();
  if(q.get('tip'))d.querySelector('.spec .help').focus();
  if(q.get('export')){d.getElementById('export3mf').click();const s=d.querySelector('input[name="slot"][value="'+q.get('export')+'"]');if(s)s.click()}
  if(q.get('menu'))d.querySelectorAll('.menu-btn')[+q.get('menu')].click();
  if(q.get('link')){d.querySelectorAll('.menu-btn')[1].click();d.querySelector('[data-action="link"]').click()}
  // custom=dlg: Dialog „Eigenen Drucker verwenden“ zeigen; custom=1: zusätzlich templates/snapmaker_u1_0.4.3mf
  // als „eigenes Profil“ hochladen (DataTransfer statt echtem Dateidialog)
  // custom=list: beide Vorlagen nacheinander als eigene Drucker einlesen, danach die Auswahl öffnen
  const upload=(f,name)=>fetch('../templates/'+f).then(r=>r.arrayBuffer()).then(b=>{
   d.getElementById('printerOrcaBtn').click();d.getElementById('customPrinterOpen').click();
   const inp=d.getElementById('customPrinterFile'),dt=new w.DataTransfer();dt.items.add(new w.File([b],name));
   inp.files=dt.files;inp.dispatchEvent(new w.Event('change'));return new Promise(r=>setTimeout(r,1500));
  });
  if(q.get('custom')==='list')upload('kobra_s1_0.4.3mf','a.3mf').then(()=>upload('snapmaker_u1_0.4.3mf','b.3mf')).then(()=>d.getElementById('printerOrcaBtn').click());
  else if(q.get('custom')){
   d.getElementById('printerOrcaBtn').click();
   if(q.get('vendor')){const v=d.getElementById('pickVendor');v.value=q.get('vendor');v.dispatchEvent(new w.Event('change'))}
   if(q.get('search')){const s=d.getElementById('pickSearch');s.value=q.get('search');s.dispatchEvent(new w.Event('input'))}
   if(q.get('custom')!=='picker')d.getElementById('customPrinterOpen').click();
   if(q.get('custom')==='1')upload('snapmaker_u1_0.4.3mf','mein-drucker.3mf');
  }
 });
};
</script>
